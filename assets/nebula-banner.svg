<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nebula Code banner</title>
  <desc id="desc">A neon pink and purple pixel-style title reading Nebula Code.</desc>
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff72d2"/>
      <stop offset="50%" stop-color="#f063ff"/>
      <stop offset="100%" stop-color="#8f5dff"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff8ee5"/>
      <stop offset="100%" stop-color="#d87bff"/>
    </linearGradient>
    <pattern id="dot" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="transparent"/>
      <circle cx="3" cy="3" r="1.5" fill="#f6d7ff" opacity="0.75"/>
      <circle cx="9" cy="9" r="1.5" fill="#f6d7ff" opacity="0.75"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="10" flood-color="#a33cff" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#050505"/>

  <g filter="url(#shadow)">
    <g font-family="'Segoe UI', 'Arial Black', sans-serif" font-weight="900" text-rendering="geometricPrecision">
      <text x="120" y="430" font-size="350" fill="url(#grad)" stroke="#f9e5ff" stroke-width="12" paint-order="stroke fill" letter-spacing="4">NEBULA</text>
      <text x="260" y="760" font-size="300" fill="url(#grad2)" stroke="#f9e5ff" stroke-width="10" paint-order="stroke fill" letter-spacing="4">CODE</text>
    </g>
  </g>

  <g opacity="0.95">
    <rect x="205" y="260" width="136" height="15" fill="#f6d7ff" opacity="0.75"/>
    <rect x="505" y="255" width="120" height="15" fill="#f6d7ff" opacity="0.75"/>
    <rect x="1170" y="255" width="140" height="15" fill="#f6d7ff" opacity="0.75"/>
    <rect x="350" y="525" width="128" height="15" fill="#f6d7ff" opacity="0.75"/>
    <rect x="790" y="525" width="120" height="15" fill="#f6d7ff" opacity="0.75"/>
    <rect x="1160" y="530" width="130" height="15" fill="#f6d7ff" opacity="0.75"/>
  </g>

  <g opacity="0.3" mask="url(#mask)">
    <rect width="1600" height="900" fill="url(#dot)"/>
  </g>

  <defs>
    <mask id="mask">
      <rect width="1600" height="900" fill="black"/>
      <text x="120" y="430" font-size="350" font-family="'Segoe UI', 'Arial Black', sans-serif" font-weight="900" fill="white" stroke="white" stroke-width="2" letter-spacing="4">NEBULA</text>
      <text x="260" y="760" font-size="300" font-family="'Segoe UI', 'Arial Black', sans-serif" font-weight="900" fill="white" stroke="white" stroke-width="2" letter-spacing="4">CODE</text>
    </mask>
  </defs>
</svg>
